<!DOCTYPE html>
<html lang="de" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="icon" type="image/png" href="./assets/img/2_character_pepe/2_walk/W-21.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/responsive.css">
    <script src="./scripts/game.js" type="module"></script>
</head>
<body>
    <div class="rotate-device-screen">
        <div class="rotate-phone">
            <div class="phone-shape"></div>
            <div class="rotate-arrow top-arrow"></div>
            <div class="rotate-arrow bottom-arrow"></div>
        </div>
        <p>Flip screen</p>
    </div>

    <main class="page-wrapper">
        <h1>El Pollo Loco</h1>

        <section class="game-wrapper">
            <div class="game-stage">
                <canvas id="canvas" width="720" height="480"></canvas>
                <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="Fullscreen">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 19v-5h2v3h3v2H5Zm0-9V5h5v2H7v3H5Zm9 9v-2h3v-3h2v5h-5Zm3-9V7h-3V5h5v5h-2Z"/>
                    </svg>
                </button>
                <button id="muteButton" class="mute-button" type="button" aria-label="Mute sound">
                    <svg class="sound-on-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3c0-1.8-1-3.3-2.5-4.1v8.2c1.5-.8 2.5-2.3 2.5-4.1Zm-2.5-8v2.1c2.4.9 4 3.2 4 5.9s-1.6 5-4 5.9V20c3.5-1 6-4.2 6-8s-2.5-7-6-8Z"/>
                    </svg>
                    <svg class="sound-off-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 4V5L8 9H4Zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4L17.6 12Z"/>
                    </svg>
                </button>
                <div id="startScreen" class="menu-screen">
                    <div class="start-menu">
                        <button id="startButton" class="menu-button" type="button">Start Game</button>
                    </div>
                    <div class="how-to-play-menu">
                        <button id="howToPlayButton" class="menu-button" type="button">How to play</button>
                    </div>
                    <div id="howToPlayScreen" class="how-to-play-screen d-none">
                        <div class="how-to-play">
                            <button id="closeHowToPlayButton" class="close-button" type="button">X</button>
                            <h3>How to play</h3>
                            <p>Left / Right: Arrow keys</p>
                            <p>Jump: Space</p>
                            <p>Throw bottle: D</p>
                        </div>
                    </div>
                </div>
                <div id="gameOverScreen" class="end-screen game-over-screen d-none">
                    <button class="menu-button restart-button" type="button">Restart</button>
                    <button class="menu-button home-button" type="button">Home</button>
                </div>
                <div id="winScreen" class="end-screen win-screen d-none">
                    <h2>You Win</h2>
                    <button class="menu-button restart-button" type="button">Restart</button>
                    <button class="menu-button home-button" type="button">Home</button>
                </div>
                <div class="mobile-controls">
                    <div class="mobile-control-group">
                        <button class="mobile-control-button" data-mobile-key="LEFT" type="button" aria-label="Move left">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M15.5 5 8.5 12l7 7-1.8 1.8L4.9 12l8.8-8.8L15.5 5Z"/>
                            </svg>
                        </button>
                        <button class="mobile-control-button" data-mobile-key="RIGHT" type="button" aria-label="Move right">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m8.5 19 7-7-7-7 1.8-1.8 8.8 8.8-8.8 8.8L8.5 19Z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="mobile-control-group">
                        <button class="mobile-control-button" data-mobile-key="UP" type="button" aria-label="Jump">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m12 4 8.8 8.8-1.8 1.8-5.8-5.8V21h-2.5V8.8l-5.8 5.8-1.8-1.8L12 4Z"/>
                            </svg>
                        </button>
                        <button class="mobile-control-button throw-button" data-mobile-key="THROW" type="button" aria-label="Throw bottle">
                            <img src="./assets/img/6_salsa_bottle/salsa_bottle.png" alt="">
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
